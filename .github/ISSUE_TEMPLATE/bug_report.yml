name: Bug report
description: Something is drawn wrong, a command fails, or the output is wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >-
        The smallest Terraform or steps that show it. Remove account IDs, names and other
        private values first.
      render: hcl
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The command's output or error.
      render: text
  - type: input
    id: version
    attributes:
      label: desprawl version
      description: "`desprawl version`"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Terraform version and provider
      placeholder: macOS 15, Terraform 1.14.2, hashicorp/aws 6.20
